    <title>AfterHours - Cebu Nightlife Ambassador & VIP Booking</title>
    <meta name="description" content="Automated club ambassador for Cebu City nightlife venues handling instant guest list entry, interactive table reservations with deposits, live floor maps, and commission tracking." />
    <script>
      // Guard against scripts/polyfills trying to assign to window.fetch when it has only a getter in iframe environments
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' ? window.fetch : null;
          var _currentFetch = nativeFetch ? nativeFetch.bind(window) : null;
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _currentFetch; },
                set: function(fn) { _currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return _currentFetch; },
                set: function(fn) { _currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
